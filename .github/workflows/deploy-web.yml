name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'firebase/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install & build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          # Leere Secrets setzen die Env-Vars trotzdem — Vite bevorzugt process.env
          # gegenüber .env.production. Leere Werte müssen daher explizit entfernt werden.
          for v in \
            VITE_FIREBASE_API_KEY \
            VITE_FIREBASE_AUTH_DOMAIN \
            VITE_FIREBASE_PROJECT_ID \
            VITE_FIREBASE_STORAGE_BUCKET \
            VITE_FIREBASE_MESSAGING_SENDER_ID \
            VITE_FIREBASE_APP_ID
          do
            if [ -z "${!v}" ]; then
              unset "$v"
            fi
          done

          if [ -z "${VITE_FIREBASE_API_KEY:-}" ] || [ -z "${VITE_FIREBASE_APP_ID:-}" ]; then
            if [ ! -f .env.production ]; then
              echo "Weder GitHub-Secrets noch web/.env.production vorhanden."
              exit 1
            fi
            echo "Build mit web/.env.production"
          else
            echo "Build mit GitHub Secrets VITE_FIREBASE_*"
          fi

          npm ci
          npm run build

          # Fail-fast: Config muss im Bundle landen (sonst Login kaputt).
          JS=$(ls dist/assets/index-*.js | head -1)
          if ! grep -q 'AIzaSy' "$JS"; then
            echo "FEHLER: Firebase apiKey fehlt im Production-Bundle ($JS)."
            exit 1
          fi
          if ! grep -q '9f465e3a7aa0e3d8791655' "$JS"; then
            echo "FEHLER: Firebase appId fehlt im Production-Bundle ($JS)."
            exit 1
          fi
          echo "Firebase-Config im Bundle verifiziert: $JS"

      - name: Prepare Firebase public
        working-directory: .
        run: |
          rm -rf firebase/public
          cp -a web/dist firebase/public

      - name: Deploy Firebase Hosting + Rules
        working-directory: firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN fehlt — Secret im Repo setzen (firebase login:ci)."
            exit 1
          fi
          npx --yes firebase-tools@13 deploy --only hosting,firestore --project alamida---monitoring --non-interactive --token "$FIREBASE_TOKEN"
