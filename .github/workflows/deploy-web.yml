name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'firebase/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install & build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          if [ -z "$VITE_FIREBASE_API_KEY" ] || [ -z "$VITE_FIREBASE_APP_ID" ]; then
            echo "VITE_FIREBASE_API_KEY / VITE_FIREBASE_APP_ID fehlen."
            echo "In GitHub → Settings → Secrets and variables → Actions anlegen"
            echo "(Werte aus Firebase Console → Projekteinstellungen → Web-App)."
            exit 1
          fi
          # Defaults, falls nur API_KEY + APP_ID gesetzt sind
          export VITE_FIREBASE_PROJECT_ID="${VITE_FIREBASE_PROJECT_ID:-alamida---monitoring}"
          export VITE_FIREBASE_AUTH_DOMAIN="${VITE_FIREBASE_AUTH_DOMAIN:-alamida---monitoring.firebaseapp.com}"
          export VITE_FIREBASE_STORAGE_BUCKET="${VITE_FIREBASE_STORAGE_BUCKET:-alamida---monitoring.firebasestorage.app}"
          npm ci
          npm run build

      - name: Prepare Firebase public
        working-directory: .
        run: |
          rm -rf firebase/public
          cp -a web/dist firebase/public

      - name: Deploy Firebase Hosting + Rules
        working-directory: firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN fehlt — Secret im Repo setzen (firebase login:ci)."
            exit 1
          fi
          npx --yes firebase-tools@13 deploy --only hosting,firestore --project alamida---monitoring --non-interactive --token "$FIREBASE_TOKEN"
